[project]
name = "tenderbrief-agent"
version = "0.1.0"
description = "TenderBrief 招标材料解析 Agent"
requires-python = ">=3.10"
dependencies = [
    "python-docx>=1.1.0",
    "pymupdf>=1.24.0",
    "pydantic>=2.7.0",
    "fastapi>=0.110.0",
    "uvicorn[standard]>=0.29.0",
    "httpx>=0.27.0",
    "python-dotenv>=1.0.0",
    "python-multipart>=0.0.9",
    "openpyxl>=3.1.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0.0"]
ocr = ["paddleocr>=2.7.0"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["bidmaster*"]
